<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="ui.css">
  <title>MeetMe</title>
</head>
<body class="popup">
  <main>
    <div class="popup-head">
      <span class="brand">
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="9" y="3" width="6" height="10.5" rx="3" fill="currentColor"></rect>
          <path d="M6 11.5a6 6 0 0 0 12 0M12 17.5V21M9 21h6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path>
        </svg>
        MeetMe
      </span>
      <span id="phase" class="pill">Idle</span>
    </div>

    <div class="popup-status">
      <p id="status" role="status">Checking helper…</p>
      <span id="elapsed" class="elapsed" hidden></span>
    </div>

    <button id="record" class="btn btn-primary btn-lg">Record this tab</button>

    <label class="switch">
      <input id="mic" type="checkbox" checked>
      <span class="switch-track"></span>
      <span class="switch-label">Include my microphone</span>
    </label>

    <p class="small popup-note">Muting yourself in the meeting does not mute MeetMe’s separate microphone recording.</p>
    <p id="error" class="error" hidden></p>

    <nav class="popup-foot">
      <a href="webui/index.html" target="_blank">Library</a>
      <a href="options.html" target="_blank">Settings</a>
    </nav>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
