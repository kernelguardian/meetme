<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="ui.css"><title>MeetMe settings</title></head><body><main><h1>MeetMe settings</h1><section class="card"><h2>Local library</h2><p id="library">Loading…</p><button id="folder">Choose folder</button></section><section class="card"><h2>Microphone</h2><p>MeetMe records your microphone independently from the meeting app’s mute button.</p><select id="device"><option value="">Default microphone</option></select><button id="grant">Allow microphone</button><p id="mic-status" class="meta" role="status"></p></section><section class="card"><h2>Local processing model</h2><select id="model"><option value="openai_whisper-tiny">Whisper tiny</option><option value="openai_whisper-base">Whisper base</option><option value="openai_whisper-small">Whisper small</option></select><button id="save">Save model</button><button id="download">Download model</button><p id="model-status" class="meta" role="status"></p><p id="summary-status" class="meta"></p></section><section class="card"><h2>Recording reminder</h2><p>Obtain any required participant consent before recording. Join reminders are advisory and never start a recording.</p></section></main><script type="module" src="options.js"></script></body></html>
